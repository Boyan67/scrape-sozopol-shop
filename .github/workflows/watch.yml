name: Sozopol Shop Watch

on:
  schedule:
    # GitHub's scheduler queues heavily at round UTC times (0 7 * * * fired 4-6h late
    # in practice, e.g. 11:00-13:30 UTC instead of 07:00). An off-round minute dodges
    # most of that congestion. ~06:53 UTC = ~09:53 Europe/Sofia during DST (summer);
    # after DST ends in late October this becomes ~08:53 local.
    - cron: "53 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python watch_sozopol.py

      - name: Commit updated snapshot/log
        run: |
          git config user.name "sozopol-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshot.json run.log
          git diff --cached --quiet || git commit -m "Update snapshot - $(date -u +%Y-%m-%d)"
          git push
