name: Sozopol Shop Watch

on:
  schedule:
    # 10:00 Europe/Sofia = 07:00 UTC during DST (summer).
    # After DST ends in late October this will fire at 09:00 local instead of 10:00.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python watch_sozopol.py

      - name: Commit updated snapshot/log
        run: |
          git config user.name "sozopol-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshot.json run.log
          git diff --cached --quiet || git commit -m "Update snapshot - $(date -u +%Y-%m-%d)"
          git push
